<style>
:root{--sun:#ffe21f;--pink:#e0338a;--sky:#2f7fd8;--lime:#9bc53d;--plum:#8b1a7e;--lilac:#c9b6d9;--green:#0f8a3c;--orange:#e8741a;--red:#e8281e;--ink:#2a1a14;--soft:#5b4a6b;--card:#fffaf0;--bg:#fdeef3;--tx:#2a2a5a;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--ink:#fff3dc;--soft:#d9c8ee;--card:#3a2a4a;--bg:#2a1d38;--plum:#ff9be0;--sky:#7ab8ff;--green:#6fdc8c;--pink:#ff6fb0;--orange:#ffa45c}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font:500 18px/1.5 "Baloo 2","Trebuchet MS",sans-serif;background:transparent}
#bgc{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
h1,h2,h3,.logo{font-family:"Bagel Fat One",Impact,sans-serif;font-weight:400;line-height:1.05;margin:0}
main{max-width:720px;margin:0 auto;padding:12px 14px calc(40px + env(safe-area-inset-bottom,0px));padding-top:calc(12px + env(safe-area-inset-top,0px))}
[hidden]{display:none!important}
b,strong{color:var(--plum);font-weight:700}
.tb{display:flex;align-items:center;gap:10px;justify-content:space-between}
.logo{font-size:34px;text-decoration:none;display:flex}
.logo span:nth-child(1){color:#e8281e}.logo span:nth-child(2){color:#f5a000}.logo span:nth-child(3){color:#e0338a}.logo span:nth-child(4){color:#4a90d9}
#who{min-width:0;font-weight:700;font-size:15px;flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--sky)}
.btn{font:inherit;font-weight:700;font-size:19px;border:0;border-radius:999px;padding:12px 28px;cursor:pointer;background:var(--sun);color:#2a1a14;box-shadow:0 6px 0 #c9a800;--spc:#2a1a14}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c9a800}
.btn.pink{background:var(--pink);color:#fff;box-shadow:0 6px 0 #9c1f62;--spc:#fff}
.btn.blue{background:var(--sky);color:#fff;box-shadow:0 6px 0 #1c569b;--spc:#fff}
.btn:disabled,.hint:disabled,.back:disabled{opacity:.7;cursor:wait}
.hint,.back{font:inherit;font-weight:700;font-size:16px;border-radius:999px;padding:6px 16px;cursor:pointer;--spc:var(--sky)}
.hint{background:none;border:3px dashed var(--sky);color:var(--sky)}
.hint.o{border-color:var(--orange);color:var(--orange);--spc:var(--orange)}
.back{background:var(--lilac);color:#2a1a14;border:0;padding:3px 14px;font-size:15px;--spc:#2a1a14}
:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
/* spinner: botones + pantalla */
@keyframes rot{to{transform:rotate(360deg)}}
.ld{position:relative;color:transparent!important}
.ld::after{content:"";position:absolute;inset:0;margin:auto;width:22px;height:22px;border:4px solid var(--spc,#2a1a14);border-top-color:transparent;border-radius:50%;animation:rot .7s linear infinite}
#ld{position:fixed;inset:0;z-index:30;display:grid;place-content:center;justify-items:center;gap:10px;background:rgba(253,238,243,.6);backdrop-filter:blur(2px)}
@media(prefers-color-scheme:dark){#ld{background:rgba(42,29,56,.65)}}
#ld i{width:62px;height:62px;border-radius:50%;border:9px solid var(--lilac);border-top-color:var(--pink);border-right-color:var(--sun);border-bottom-color:var(--sky);animation:rot .8s linear infinite}
#ld span{font-weight:700;color:var(--plum)}
.coach{display:flex;align-items:center;gap:10px;margin:8px 0}
.figwrap{flex:none;width:96px}
.nm{display:block;width:max-content;margin:2px auto 0;background:var(--sun);color:#2a1a14;border-radius:999px;padding:0 12px;font-weight:700;font-size:14px;line-height:1.5}
.say{position:relative;background:#fff;color:#2a1a14;border:4px solid #2a1a14;border-radius:22px;padding:8px 16px;font-weight:700;font-size:20px;line-height:1.2;flex:1}
.say b{color:var(--plum)}
.say::before{content:"";position:absolute;left:-18px;top:50%;margin-top:-10px;border:10px solid transparent;border-right:14px solid #2a1a14;border-left:0}
.say::after{content:"";position:absolute;left:-9px;top:50%;margin-top:-6px;border:6px solid transparent;border-right:9px solid #fff;border-left:0}
.say.good{background:var(--sun)}.say.bad{background:var(--lilac)}
.say small{display:block;font-size:15px;font-weight:500;margin-top:2px;color:#5b2a6b}
.card{background:var(--card);border-radius:26px;padding:20px 18px;box-shadow:0 7px 0 var(--pink);margin-top:10px;animation:pop .3s}
.card h2{font-size:26px;margin-bottom:8px;color:var(--pink)}
.card+.card{margin-top:22px;box-shadow:0 7px 0 var(--sky)}.card+.card h2{color:var(--sky)}
.card+.card+.card{box-shadow:0 7px 0 var(--green)}.card+.card+.card h2{color:var(--green)}
.card+.card+.card+.card{box-shadow:0 7px 0 var(--orange)}.card+.card+.card+.card h2{color:var(--orange)}
@keyframes pop{from{transform:scale(.96);opacity:0}}
/* tareas: texto más fino y con color */
.q{font:600 clamp(19px,4.2vw,23px)/1.4 "Baloo 2",sans-serif;margin:8px 0 12px;color:var(--ink)}
.sit{display:inline-block;background:var(--sky);color:#fff;border-radius:12px;padding:0 12px;margin-bottom:6px;font-weight:600;font-size:.9em}
.hl{color:var(--plum);background:linear-gradient(transparent 58%,rgba(255,226,31,.55) 58%);padding:0 2px;font-weight:700}
.ln{display:inline-block;border-radius:999px;padding:1px 14px;font-weight:700;font-size:15px;color:#fff;background:var(--sky);margin:0 0 4px}
.ln.any{background:var(--green)}
label{display:block;font-weight:700;margin:12px 0 4px;color:var(--sky)}
input,select{width:100%;font:inherit;font-size:18px;padding:10px 14px;border-radius:14px;border:3px solid var(--lilac);background:#fff;color:var(--tx)}
input:focus,select:focus{border-color:var(--pink);outline:none}
textarea{width:100%;font:500 18px/32px "Baloo 2",sans-serif;color:var(--tx);padding:8px 16px 8px 24px;border-radius:18px;border:3px solid var(--sky);resize:vertical;min-height:132px;background:repeating-linear-gradient(#fffdf6 0 31px,#cfe3f5 31px 32px);background-attachment:local;box-shadow:inset 6px 0 0 var(--pink),0 5px 0 var(--lilac);transition:box-shadow .2s,border-color .2s}
textarea:focus{outline:none;border-color:var(--pink);box-shadow:inset 6px 0 0 var(--pink),0 0 0 5px rgba(224,51,138,.25),0 5px 0 var(--pink)}
textarea::placeholder{color:#8a96b8;font-style:italic}
.tabs{display:flex;gap:8px;margin-bottom:6px}
.tabs button{flex:1;font:inherit;font-weight:700;border:3px solid var(--lilac);border-radius:999px;padding:6px;background:#fff;color:var(--soft);cursor:pointer}
.tabs button.on{background:var(--pink);color:#fff;border-color:var(--plum)}
.err{color:#b3001b;font-weight:700;margin:8px 0}
@media(prefers-color-scheme:dark){.err{color:#ffb4ab}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.chips span{border-radius:999px;padding:1px 12px;font-weight:700;font-size:14px;color:#fff;background:var(--sky)}
.chips span:nth-child(2){background:var(--orange)}.chips span:nth-child(3){background:var(--green)}.chips span:nth-child(1){background:var(--pink)}
.meta{font-size:15px;color:var(--soft);margin:0 0 6px}
.tip{background:var(--sun);color:#2a1a14;border-radius:20px 20px 20px 4px;padding:10px 16px;margin-top:10px;font-size:17px}
.tip b{color:#8b1a7e}
.tip.blue{background:#dcecff;color:#14335f;border-left:8px solid var(--sky)}.tip.blue b{color:#1c569b}
.tip.green{background:#e3f6d6;color:#17421f;border-left:8px solid var(--green)}.tip.green b{color:#0b5a28}
.br{display:grid;grid-template-columns:128px 1fr 46px;gap:8px;align-items:center;font-weight:700;font-size:15px;margin:8px 0}
.br span{color:var(--sky)}.br em{display:block;font-style:normal;font-weight:500;font-size:12.5px;color:var(--soft);line-height:1.1}
.br b{color:var(--green)}
.prog{height:16px;border-radius:99px;background:var(--lilac);overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--orange),var(--lime),var(--green))}
.steps{display:grid;gap:8px;margin-top:6px}
.steps div{display:flex;gap:10px;align-items:center;border-left:8px solid var(--c);border-radius:14px;padding:6px 12px 6px 8px;background:var(--bg)}
.steps b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:15px}
.pc{border-radius:18px;padding:10px 14px;margin:8px 0;border-left:10px solid var(--c);background:var(--bg)}
.pc h3{font-size:20px;color:var(--c);margin-bottom:2px}.pc p{margin:2px 0;font-size:16px}.pc .d{color:var(--soft);font-size:14px}
.rate{display:flex;gap:8px;flex-wrap:wrap}
.rate label{display:flex;gap:6px;align-items:center;margin:0;font-weight:700;font-size:15px;background:var(--bg);color:var(--ink);border-radius:999px;padding:4px 12px;border:2px solid var(--lilac)}
.rate input{width:auto}
.chk{display:flex;gap:8px;align-items:center;font-weight:600;font-size:15px;color:var(--orange)}
.chk input{width:20px;height:20px;accent-color:var(--pink)}
.chat{display:grid;gap:8px;max-height:46vh;overflow:auto;padding:2px}
.bub{max-width:86%;padding:8px 14px;border-radius:18px;font-weight:700;font-size:16px}
.bub.me{justify-self:end;background:var(--sky);color:#fff;border-bottom-right-radius:4px}
.bub.mg{justify-self:start;background:var(--sun);color:#2a1a14;border-bottom-left-radius:4px}
.fig *{transform-box:view-box}
.fig{width:100%;height:auto;display:block;overflow:visible}
.fig .body-g{transform-origin:60px 170px}.fig .head-g{transform-origin:60px 58px}
.fig .armL,.fig .armR{transform-origin:60px 72px}.fig .legL,.fig .legR{transform-origin:60px 108px}
.fig .eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.fig .m-sad,.fig .m-big{display:none}
.fig.idle .body-g{animation:sway 2.6s ease-in-out infinite}
.fig.idle .armL{animation:swL 2.6s ease-in-out infinite}.fig.idle .armR{animation:swR 2.6s ease-in-out infinite}
@keyframes sway{50%{transform:translateY(-4px) rotate(2deg)}}@keyframes swL{50%{transform:rotate(14deg)}}@keyframes swR{50%{transform:rotate(-14deg)}}
.fig.happy .m-smile{display:none}.fig.happy .m-big{display:inline}
.fig.happy .body-g{animation:jump .55s ease-in-out 4}
.fig.happy .armL{transform:rotate(85deg)}.fig.happy .armR{transform:rotate(-85deg)}
@keyframes jump{0%,100%{transform:translateY(0)}45%{transform:translateY(-22px)}}
.fig.sad .m-smile{display:none}.fig.sad .m-sad{display:inline}
.fig.sad .body-g{transform:translateY(5px)}.fig.sad .armL{transform:rotate(-38deg)}.fig.sad .armR{transform:rotate(38deg)}
.lvrow{display:flex;gap:14px;align-items:center}
.lvb{flex:none;width:76px;height:96px;border-radius:40px;display:grid;place-items:center;font:400 36px "Bagel Fat One",sans-serif;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.28);border:4px solid var(--card)}
.lvt{margin:0;font-size:19px;font-weight:600;line-height:1.35}
.chips.sc span{background:var(--lilac);color:#2a1a14;font-size:13.5px}.chips.sc span.me{background:var(--green);color:#fff}
.vopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0}
.vopt{font:600 19px "Baloo 2",sans-serif;padding:12px;border-radius:16px;border:3px solid var(--sky);background:#fff;color:var(--tx);cursor:pointer;box-shadow:0 4px 0 var(--lilac)}
.vopt:hover:not(:disabled){background:var(--sun)}.vopt.good{background:var(--green);color:#fff;border-color:#0b5a28}.vopt.bad{background:#ffb4ab;border-color:#9a1010;color:#5a0a0a;animation:shk .4s}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.vpic{display:flex;gap:12px;align-items:center;min-height:64px}#pic{font-size:52px;line-height:1}
.inst{font:700 14px "Baloo 2",sans-serif;background:var(--sun);color:#2a1a14;border:0;border-radius:999px;padding:3px 12px;cursor:pointer;box-shadow:0 3px 0 #c9a800;white-space:nowrap}
.inst:active{transform:translateY(2px);box-shadow:0 1px 0 #c9a800}
.modal{position:fixed;inset:0;z-index:40;background:rgba(20,10,30,.6);display:grid;place-items:center;padding:16px}
.mbox{width:min(420px,100%);background:var(--card);border-radius:26px;padding:20px;box-shadow:0 8px 0 var(--pink);max-height:calc(100dvh - 32px);overflow:auto;animation:pop .3s}
.mbox h2{font-size:24px;color:var(--pink);margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:35;display:flex;gap:10px;align-items:center;background:var(--sun);color:#2a1a14;border-radius:999px;padding:6px 8px 6px 18px;font-weight:700;box-shadow:0 5px 0 #c9a800;max-width:calc(100% - 24px)}
.toast .btn{font-size:15px;padding:6px 16px;box-shadow:0 3px 0 #9c1f62;background:var(--pink);color:#fff}
.wd{font:600 16px "Baloo 2",sans-serif;border:0;border-radius:999px;padding:4px 14px;margin:3px 4px 3px 0;cursor:pointer}
.wd.m{background:var(--green);color:#fff}.wd.s{background:var(--orange);color:#fff}.wd.t{background:var(--lilac);color:#2a1a14}
.gt{font-size:18px;margin:12px 0 4px;color:var(--sky);cursor:pointer;font-weight:700}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.ld::after,#ld i{animation:rot 1.6s linear infinite!important}}
@media(max-width:480px){.figwrap{width:72px}.say{font-size:17px}.br{grid-template-columns:104px 1fr 42px}.row .btn{width:100%}}
</style>
</head>

let inflight=0,ldT;
function ld(d){inflight+=d;clearTimeout(ldT);if(inflight>0)ldT=setTimeout(()=>{$('#ld').hidden=false},250);else $('#ld').hidden=true}
async function api(p,m='GET',b){
 let r;ld(1);
 try{try{r=await fetch(API+p,{method:m,headers:{'Content-Type':'application/json',...(S.token?{Authorization:'Bearer '+S.token}:{})},body:b?JSON.stringify(b):undefined})}
 catch(e){throw new Error('No puedo hablar con el servidor ('+API+'). ¿Está corriendo uvicorn?')}
 const j=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(typeof j.detail=='string'?j.detail:'Revisa los datos e inténtalo de nuevo');
 return j}finally{ld(-1)}}

function doAuth(e){e.preventDefault();const b=e.target.querySelector('[type=submit]');
 act(b,async()=>{const body={email:$('#em').value,password:$('#pw').value};if(mode=='reg')body.name=$('#nm').value;

function logout(){S={};save();vLogin()}
async function route(){
 if(!S.token)return vLogin();
 $('#who').textContent=S.name||S.email;$('#out').hidden=false;
 try{
  if(!S.user_id)return vOnb();
  if(PL){await api('/users/'+S.user_id+'/placement','POST',PL);PL=null;try{localStorage.removeItem('migo-pl')}catch(e){}}
  const p=await api('/users/'+S.user_id+'/profile');
  setLang(p.lang);
  if(p.stage!='diagnosed')return p.path&&p.path.n==null?vPlace():vDiag();   // si ya hay nivel (viene del test o lo hizo antes) NO se repite

 }catch(e){if(/Sesión/.test(e.message))return logout();vLogin();err(e.message)}}

const LVS=['A1','A2','B1','B2','C1','C2'];
const shuf=a=>{a=a.slice();for(let k=a.length;k>1;k--){const j=Math.random()*k|0;[a[k-1],a[j]]=[a[j],a[k-1]]}return a};
function speak(t){try{if(!('speechSynthesis' in window)||!t)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
const VOC=VOCRAW.map(l=>l.map(x=>{const [w,e,s]=x.split('|');return{w,e,s}}));
const rxw=w=>new RegExp('\\b'+w.split(' ').map(t=>t+'\\w*').join('\\s+'),'i');
VOC.forEach(l=>l.forEach(x=>{const m=x.s.match(rxw(x.w));x.c=m?x.s.replace(m[0],'_____'):null}));   // frase con hueco (null = no sirve)

 const mas=L.filter(x=>by.has(x.w)&&by.get(x.w).unaided>=2),vis=L.filter(x=>by.has(x.w)&&by.get(x.w).unaided<2),tod=L.filter(x=>!by.has(x.w));

function mkItem(x,lst,lv){const gap=Math.max(5,Math.round(lst.length/8)),i=lst.indexOf(x),far=lst.filter((y,j)=>y!==x&&Math.abs(j-i)>=gap),near=lst.filter((y,j)=>y!==x&&Math.abs(j-i)<gap);return{...x,lv:lv,d:shuf(far).concat(shuf(near)).slice(0,3).map(y=>y.w)}}
/* práctica: primero palabras por ver, luego las vistas por repasar; mode 'review' = solo repasar */
function pickPractice(k,st,mode){
 const by=new Map(st.words.filter(w=>w.lv==k).map(w=>[w.w,w])),L=VOC[k].filter(x=>x.c);
 const un=L.filter(x=>!by.has(x.w)),rev=L.filter(x=>by.has(x.w)&&by.get(x.w).unaided<2);
 let it=(mode=='review'?shuf(rev):shuf(un).concat(shuf(rev))).slice(0,8).map(x=>mkItem(x,VOC[k],k));
 if(it.length<8&&mode!='review'&&k<4)it=it.concat(shuf(VOC[k+1].filter(x=>x.c)).slice(0,8-it.length).map(x=>mkItem(x,VOC[k+1],k+1)));
 return shuf(it)}
function vocabPractice(b,mode){act(b,async()=>{

const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const canSW=()=>'serviceWorker' in navigator&&/^https?:$/.test(location.protocol);
const IOS_HELP='<p>En iPhone y iPad se instala desde Safari:</p><div class="steps"><div style="--c:var(--pink)"><b>1</b><span>Toca el botón <b>Compartir</b> ⬆️ de Safari.</span></div><div style="--c:var(--sky)"><b>2</b><span>Elige <b>Añadir a pantalla de inicio</b>.</span></div><div style="--c:var(--green)"><b>3</b><span>Toca <b>Añadir</b>. ¡Listo, Migo queda como una app!</span></div></div>';
const GEN_HELP='<p>Abre el menú de tu navegador (⋮ o ⋯) y elige <b>Instalar app</b> o <b>Añadir a pantalla de inicio</b>.</p><p class="meta">Si no aparece, abre Migo en Chrome o Edge (Android y computadora) o en Safari (iPhone).</p>';
function showInst(){inst.hidden=isStandalone()||!(DIP||isIOS()||canSW())}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();DIP=e;showInst()});
addEventListener('appinstalled',()=>{DIP=null;showInst();migo('happy','¡Migo instalada! 🎉')});
inst.addEventListener('click',async()=>{
 if(DIP){const p=DIP;DIP=null;p.prompt();try{await p.userChoice}catch(e){}showInst();return}
 $('#pwab').innerHTML=tr(isIOS()?IOS_HELP:GEN_HELP);$('#pwa').hidden=false});
function closePwa(){$('#pwa').hidden=true}
try{matchMedia('(display-mode: standalone)').addEventListener('change',showInst)}catch(e){}
showInst();
if(canSW()){const hadCtl=!!navigator.serviceWorker.controller;let rl=false;
 addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(reg=>{
  const ask=w=>{if(w&&navigator.serviceWorker.controller){$('#upd').hidden=false;$('#updb').onclick=()=>w.postMessage('SKIP_WAITING')}};
  if(reg.waiting)ask(reg.waiting);
  reg.addEventListener('updatefound',()=>{const w=reg.installing;if(w)w.addEventListener('statechange',()=>{if(w.state==='installed')ask(w)})})}).catch(()=>{}));
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadCtl||rl)return;rl=true;location.reload()})}
setLang(LANG);route();
</script>
</body>
</html>
